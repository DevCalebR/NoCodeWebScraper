<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ScraperPro Recorder</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }
    
    h1 {
      font-size: 18px;
      margin: 0;
      color: #1f2937;
    }
    
    .status {
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .status.recording {
      background: #fee2e2;
      border: 1px solid #fecaca;
    }
    
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-start {
      background: #ef4444;
      color: white;
    }
    
    .btn-start:hover {
      background: #dc2626;
    }
    
    .tips {
      margin-top: 16px;
      padding: 12px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 8px;
      font-size: 12px;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🎥</div>
    <h1>Visual Recorder</h1>
  </div>
  
  <div id="status" class="status">
    <div id="status-text">Ready to record</div>
    <div id="action-count-text">0 actions recorded</div>
  </div>
  
  <button id="toggle-recording" class="btn-start">
    ● Start Recording
  </button>
  
  <div class="tips">
    <h3>💡 How to use:</h3>
    <ul>
      <li>Click Start Recording</li>
      <li>Click elements to extract</li>
      <li>Click Stop when done</li>
    </ul>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
